name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  npm_config_verify_deps_before_run: 'false'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned build dependencies
        run: pnpm --config.verify-deps-before-run=false install --frozen-lockfile --config.auto-install-peers=false --config.enable-global-virtual-store=false
      - name: Build and pack the plugin
        run: pnpm --config.verify-deps-before-run=false pack --pack-destination dist/release
      - name: Verify clean profile installation and production Loader behavior
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          session_url=$(node -p 'require("./.github/release-dependencies.json").dependencies["@deepseek-ai/dsh-session"].source')
          query_url=$(node -p 'require("./.github/release-dependencies.json").dependencies["@deepseek-ai/dsh-session-query"].source')
          sqlite_url=$(node -p 'require("./.github/release-dependencies.json").dependencies["@deepseek-ai/dsh-session-query-sqlite"].source')
          node tests/delivery/run.mjs --acp "dist/release/dsh-active-context-$version.tgz" --session "$session_url" --query "$query_url" --sqlite "$sqlite_url"
